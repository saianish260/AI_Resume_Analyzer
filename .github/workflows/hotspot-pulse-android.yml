name: Hotspot Pulse Android

on:
  push:
    paths:
      - "hotspot-pulse/**"
      - ".github/workflows/hotspot-pulse-android.yml"
  pull_request:
    paths:
      - "hotspot-pulse/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hotspot-pulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hotspot-pulse-apk
          path: hotspot-pulse/app/build/outputs/apk/debug/app-debug.apk
